server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:kb-jwt-secret-key-change-in-production}
    access-expiration: 7200000
    refresh-expiration: 604800000
  upload:
    dir: ./uploads
  fastapi:
    base-url: http://localhost:8000
